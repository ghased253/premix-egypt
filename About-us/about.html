      <p class="about-title">عن بريميكس ايجيبت</p>
      <p class="about-caption">تأسست شركة بريمكس إيجيبت في عام 2005 كشركة توصية
 بسيطة رائدة في مجال تصنيع مواد البناء والدهانات المتطورة.
      </p>
      <p class="about-caption">
 على مدار ما يقرب من عشرين عاماً، التزمت الشركة بتقديم أعلى معايير الجودة والابتكار في سوق مواد البناء 
المصري والإقليمي.
      </p>
      <p class="about-caption">
نحن نتميز بتقديم حلول متكاملة تشمل تصنيع وتوريد المنتجات الأسمنتية سابقة الخلط، بالإضافة إلى الدهانات المائية الأكريليك عالية الجودة والمناسبة للتطبيقات الداخلية والخارجية.</p>
      </figcaption>
      <img src="pexels-about-us-background.jpg" class="about-us-background" alt="صورة لمبني اصفر مع ماسورة">

من خلال تطوير منتجات مستدامة ومتطورة تساهم في بناء مستقبل المعمار المصري الحديث وتلبي أقصى تطلعات عملائنا.
