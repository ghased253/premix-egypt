      <p class="about-title">About Premix Egypt</p>
      <p class="about-caption">
        Founded in 2005 as a leading limited partnership company, Premix Egypt has been at the forefront of manufacturing advanced construction materials and modern paints.
      </p>

      <p class="about-caption">
        For nearly two decades, the company has been committed to delivering the highest standards of quality and innovation in the Egyptian and regional building materials market.
      </p>

      <p class="about-caption">
        We specialize in providing comprehensive solutions that include the manufacturing and supply of pre-mixed cementitious products, alongside high-quality water-based acrylic paints suitable for both interior and exterior applications.
      </p>
      </figcaption>
